<style>

*{box-sizing:border-box}

select,input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);-webkit-user-select:text;user-select:text}

#ov{position:fixed;inset:0;background:rgba(10,14,25,.96);color:#fff;display:none;z-index:50;align-items:center;justify-content:center;text-align:center;padding:24px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{width:38px;padding:7px 0;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px}.chip.ok{background:var(--bd)}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}

.hero{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(120deg,#16348f,#2457d6,#6a3fd1,#1c86d4,#16348f);background-size:400% 400%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.cover{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;text-align:center;padding:26px 20px;animation:muncul .9s ease both;box-shadow:0 18px 50px rgba(0,0,20,.35)}
@keyframes muncul{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

<body>
<div id="app"></div>
<div id="ov"><div><h2>⚠ Pelanggaran Terdeteksi</h2><p id="ovm"></p><button id="ovb">Kembali ke Ujian</button></div></div>

<script>
/* ================= PENGATURAN (ubah di sini) ================= */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxKNoP6EorCUb4_bxol12Wh5atJryMrs86AufysmqeRGINy-zvVIzXCSGzIMI9shRfNTg/exec",
  JUDUL: "Ulangan Harian Barisan dan Deret",
  MAPEL: "Matematika Kelas X",
  SEKOLAH: "SMAN 1 Ngamprah",
  GURU: "Ari Kusriani Iman, S.Pd.",
  KESEMPATAN: 3,         // hanya tampilan; harus sama dengan MAKS_PERCOBAAN di Code.gs
  DURASI_MENIT: 60,
  MAKS_PELANGGARAN: 3,   // setelah ini, jawaban otomatis dikirim
};

/* ================= BANK SOAL (parameter berbeda tiap paket) ================= */
const seq = (a,d,mul,n=4)=>Array.from({length:n},(_,i)=>mul?a*Math.pow(d,i):a+i*d).join(", ")+", …";
const num = x => String(x).replace("-","−");

/* Setiap siswa (dan tiap percobaan) mendapat angka berbeda: seluruh parameter diacak dari seed. */
function buatSoal(seed){
  const R=rng(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pc=a=>a[Math.floor(R()*a.length)];
  const M=()=>pc([2,3,4,5,6,8,10])*1000000, RD=[[1,2],[1,3],[2,3],[3,4],[1,4]];
  let bd=0; // bilangan pokok pengecoh (dipakai juga untuk pilihan jawaban)
  const catP=(b,n)=>{ // catatan: 1 benar + 1 pangkat beda (bilangan pokok sama) + 1 bilangan pokok beda (pangkat sama)
    const ce=[n-2,n-1,n+1,n+2].filter(e=>e>=1),e2=ce[Math.floor(R()*ce.length)];
    const db=[-.02,-.01,.01,.02].map(x=>+(b+x).toFixed(2)).filter(x=>x>0);bd=db[Math.floor(R()*db.length)];
    const l=[[b,n],[b,e2],[bd,n]];
    for(let j=l.length-1;j>0;j--){const t=Math.floor(R()*(j+1));[l[j],l[t]]=[l[t],l[j]]}
    return `<div class="note"><b>Catatan (hasil pangkat):</b><br>${l.map(([x,e])=>`(${k(x)})<sup>${e}</sup> = ${fx(pw(x,e))}`).join("<br>")}</div>`};
  const S=[];
  // 1. PG – suku ke-n aritmetika
  {const a=ri(2,9),b=ri(2,9),n=ri(10,25),u=a+(n-1)*b;
   S.push({type:"pg",tag:"Pilihan Ganda",
    q:`Suatu barisan aritmetika memiliki suku pertama ${a} dan beda ${b}. Suku ke-${n} barisan tersebut adalah …`,
    o:pgo(u,[a+n*b,a+(n-2)*b,a*n+b,n*b])});}
  // 2. PG – suku ke-n geometri
  {const a=ri(1,9),r=pc([2,3,4]),n=ri(4,7),u=a*Math.pow(r,n-1);
   S.push({type:"pg",tag:"Pilihan Ganda",
    q:`Perhatikan barisan geometri berikut: ${seq(a,r,1)} Suku ke-${n} barisan tersebut adalah …`,
    o:pgo(u,[a*Math.pow(r,n),a*Math.pow(r,n-2),a*n*r,a*(n-1)*r])});}
  // 3. Pilihan ganda kompleks
  {const a1=[ri(2,30),pc([-9,-7,-5,-3,3,4,5,6,8,9])],a2=[ri(2,40),pc([-8,-6,-4,-2,2,5,7])],
        g1=[ri(1,6),pc([2,3,4])],g2=[ri(1,5),pc([-2,-3])];
   S.push({type:"pk",tag:"Pilihan Ganda Kompleks",
    q:"Pilih <b>semua</b> barisan yang merupakan barisan <b>aritmetika</b> (jawaban lebih dari satu).",
    o:[{t:seq(a1[0],a1[1]),ok:1},{t:seq(a2[0],a2[1]),ok:1},{t:seq(g1[0],g1[1],1),ok:0},{t:seq(g2[0],g2[1],1),ok:0}]});}
  // 4. Benar / Salah – deret aritmetika
  {const a=ri(1,6),b=ri(2,7);let f;do{f=[R()<.5,R()<.5,R()<.5].map(Number)}while(f[0]+f[1]+f[2]==0||f[0]+f[1]+f[2]==3);
   const u10=a+9*b,s10=5*(2*a+9*b);
   S.push({type:"bs",tag:"Benar / Salah",
    q:`Diberikan deret aritmetika ${seq(a,b).replace(/, /g," + ")} Tentukan apakah setiap pernyataan berikut <b>Benar</b> atau <b>Salah</b>.`,
    o:[{t:`Beda deret tersebut adalah ${b+(f[1]?0:1)}.`,ok:f[1]},
       {t:`Suku ke-10 deret tersebut adalah ${u10+(f[0]?0:b)}.`,ok:f[0]},
       {t:`Jumlah 10 suku pertama deret tersebut adalah ${s10+(f[2]?0:10)}.`,ok:f[2]}]});}
  // 5. PG – Sn aritmetika
  {const a=ri(1,6),b=ri(2,6),n=pc([8,10,12,14,16,20]),s=n/2*(2*a+(n-1)*b);
   S.push({type:"pg",tag:"Pilihan Ganda",
    q:`Suku pertama suatu deret aritmetika adalah ${a} dan bedanya ${b}. Jumlah ${n} suku pertama deret tersebut adalah …`,
    o:pgo(s,[n/2*(2*a+n*b),n*(a+(n-1)*b),s-n,n/2*(a+(n-1)*b),s+n])});}
  // 6. PG – U20 dari U7 dan U10
  {const a=ri(1,6),b=ri(2,8),u=a+19*b;
   S.push({type:"pg",tag:"Pilihan Ganda",
    q:`Pada barisan aritmetika diketahui U<sub>7</sub> = ${a+6*b} dan U<sub>10</sub> = ${a+9*b}. Nilai U<sub>20</sub> adalah …`,
    o:pgo(u,[u+b,u-b,2*(a+9*b),u+a,u+2*b])});}
  // 7. PG – Sn geometri
  {const a=ri(1,9),n=ri(4,9),s=a*(Math.pow(2,n)-1);
   S.push({type:"pg",tag:"Pilihan Ganda",
    q:`Jumlah ${n} suku pertama deret geometri ${seq(a,2,1).replace(/, /g," + ")} adalah …`,
    o:pgo(s,[a*Math.pow(2,n),a*(Math.pow(2,n-1)-1),a*(Math.pow(2,n)+1),s+a])});}
  // 8. PG – deret geometri tak hingga (tiga suku)
  {const [rn,rd]=pc(RD),a=rd*rd*(rd-rn)*ri(1,4),s=a*rd/(rd-rn),t=[a,a*rn/rd,a*rn*rn/(rd*rd)];
   S.push({type:"pg",tag:"Deret Geometri Tak Hingga",
    q:`Jumlah deret geometri tak hingga ${t.join(" + ")} + … adalah …`,
    o:pgo(s,[s+a,s-a,2*s,s+10,a+t[1]])});}
  // 9. PG – pernyataan 1-4, pilih kombinasi yang benar (opsi A–E tetap urutannya)
  {const KO=[[1,2,3],[1,3],[2,4],[4],[1,2,3,4]],bn=pc([0,1,2,3,4]),T=new Set(KO[bn]),
   a=ri(2,9),b=ri(2,8),ga=ri(1,5),gr=pc([2,3,4]),ok3=T.has(3),R3=ok3?pc(["1/2","−1/3","2/3","−3/4"]):pc(["3/2","5/4","−2","−5/3"]),
   m=M(),i=ri(4,12),t=ri(2,5),X=m*i/100*t;
   const st4=[
    `Suku ke-10 barisan ${seq(a,b)} adalah ${a+9*b+(T.has(1)?0:b)}.`,
    `Rasio barisan ${seq(ga,gr,1)} adalah ${gr+(T.has(2)?0:1)}.`,
    `Deret geometri tak hingga dengan rasio ${R3} memiliki jumlah.`,
    `Modal Rp${rp(m)} dengan bunga tunggal ${i}% per tahun berbunga Rp${rp(T.has(4)?X:X+m*i/100)} selama ${t} tahun.`];
   const lb=c=>c.length==4?"Semua pernyataan benar":c.length==1?`Hanya pernyataan ${c[0]} yang benar`:`Pernyataan ${c.slice(0,-1).join(", ")} dan ${c[c.length-1]} benar`.replace(", dan"," dan");
   S.push({type:"pg",fix:1,tag:"Pilihan Ganda (Pernyataan)",
    q:`Perhatikan pernyataan-pernyataan berikut!<br>`+st4.map((x,j)=>`(${j+1}) ${x}`).join("<br>")+`<br>Pernyataan yang benar adalah …`,
    o:KO.map((c,j)=>({t:`${"ABCDE"[j]}. ${lb(c)}`,ok:j==bn?1:0}))});}
  // 10. PG – bunga majemuk: bunga per tahun, diperhitungkan tiap p bulan, lama dalam bulan
  {const pi=pc([[2,12],[2,18],[3,8],[3,12],[3,16],[4,9],[4,12],[4,15],[6,8],[6,10],[6,12]]),p=pi[0],i=pi[1],
   rr=i*p/12,m=ri(2,5),n=p*m,mo=M(),f=pw(1+rr/100,m);
   S.push({type:"pg",tag:"Bunga Majemuk",
    q:`Modal Rp${rp(mo)} dibungakan dengan bunga majemuk ${i}% per tahun yang diperhitungkan setiap ${p} bulan. Nilai akhir modal setelah ${n} bulan adalah …${catP(1+rr/100,m)}`,
    o:pgo(Math.round(mo*f),[mo*pw(bd,m),mo*pw(1+i/100,m),mo*(1+rr/100*m),mo*pw(1+rr/100,m-1),mo*pw(1+rr/100,m+1)].map(Math.round),x=>"Rp"+rp(x))});}
  // 11. PG – bunga tunggal (bulan)
  {const m=M(),i=pc([6,8,9,10,12]),t=pc([6,9,12,15,18]),b=m*i*t/1200;
   S.push({type:"pg",tag:"Bunga Tunggal",
    q:`Modal Rp${rp(m)} dibungakan dengan bunga tunggal ${i}% per tahun selama ${t} bulan. Besar bunga yang diperoleh adalah …`,
    o:pgo(b,[m*i*t/100,m*i/100,m+b,b*12].map(Math.round),x=>"Rp"+rp(x))});}
  // 12. PG – bunga majemuk (catatan pangkat 3 desimal)
  {const m=M(),i=pc([4,5,6,8,10]),n=ri(2,5),f=pw(1+i/100,n);
   S.push({type:"pg",tag:"Bunga Majemuk",
    q:`Modal Rp${rp(m)} dibungakan dengan bunga majemuk ${i}% per tahun. Nilai akhir modal setelah ${n} tahun adalah …${catP(1+i/100,n)}`,
    o:pgo(Math.round(m*f),[m*pw(bd,n),m*(1+i/100*n),m*pw(1+i/100,n-1),m*pw(1+i/100,n+1),m*(1+i/100)*n].map(Math.round),x=>"Rp"+rp(x))});}
  // 13. PG – pertumbuhan
  {const n0=ri(2,12)*5000,i=pc([2,3,4,5]),n=ri(3,6),f=pw(1+i/100,n);
   S.push({type:"pg",tag:"Pertumbuhan",
    q:`Jumlah penduduk suatu desa saat ini ${rp(n0)} jiwa dan bertambah ${i}% setiap tahun. Perkiraan jumlah penduduk setelah ${n} tahun adalah … jiwa${catP(1+i/100,n)}`,
    o:pgo(Math.round(n0*f),[n0*pw(bd,n),n0*(1+i/100*n),n0*pw(1+i/100,n-1),n0*pw(1+i/100,n+1),n0*i/100*n].map(Math.round),rp)});}
  // 14. PG – peluruhan
  {const v=ri(5,15)*20000000,i=pc([5,8,10,12,15]),n=ri(2,4),f=pw(1-i/100,n);
   S.push({type:"pg",tag:"Peluruhan",
    q:`Harga sebuah mobil Rp${rp(v)} menyusut ${i}% setiap tahun. Harga mobil tersebut setelah ${n} tahun adalah …${catP(1-i/100,n)}`,
    o:pgo(Math.round(v*f),[v*pw(bd,n),v*(1-i/100*n),v*pw(1-i/100,n-1),v*pw(1+i/100,n),v*(1-i/100)*n].map(Math.round),x=>"Rp"+rp(x))});}
  // 15. Benar / Salah – barisan dengan rumus U_n = pn + q
  {const p=ri(3,8),q=pc([-3,-2,-1,1,2,3,4,5]);let f;do{f=[R()<.5,R()<.5,R()<.5].map(Number)}while(f[0]+f[1]+f[2]==0||f[0]+f[1]+f[2]==3);
   const u1=p+q,s10=5*(11*p+2*q);
   S.push({type:"bs",tag:"Benar / Salah",
    q:`Suatu barisan memiliki rumus suku ke-n: U<sub>n</sub> = ${p}n ${q<0?"−":"+"} ${Math.abs(q)}. Tentukan apakah setiap pernyataan berikut <b>Benar</b> atau <b>Salah</b>.`,
    o:[{t:`Suku pertama barisan tersebut adalah ${num(f[0]?u1:q)}.`,ok:f[0]},
       {t:`Barisan tersebut merupakan barisan aritmetika dengan beda ${f[1]?p:p+1}.`,ok:f[1]},
       {t:`Jumlah 10 suku pertama barisan tersebut adalah ${f[2]?s10:10*u1}.`,ok:f[2]}]});}
  return S.map((s,i)=>({...s,id:"S"+(i+1)}));
}
function pgo(c,d,f=num){const u=[...new Set(d.filter(x=>x!==c))];for(let j=1;u.length<4;j++){const v=c+j*Math.max(1,Math.round(Math.abs(c)*.07));if(v!==c&&!u.includes(v))u.push(v)}u.length=4;return [c,...u].map((v,i)=>({t:f(v),ok:i==0?1:0}));}
const rp=x=>String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const k=x=>(+x).toFixed(3).replace(/0+$/,"").replace(/\.$/,"").replace(".",",").replace(/^(\d+)$/,"$1");
const fx=x=>x.toFixed(3).replace(".",",");
const pw=(b,n)=>+Math.pow(b,n).toFixed(3);
const cat=t=>`<div class="note"><b>Catatan:</b> ${t}</div>`;

/* ================= UTILITAS ================= */
const $=s=>document.querySelector(s), app=$("#app");
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="ujian_state_v1";
let st=null, qs=[], timerId=null, lastV=0, done=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

/* ================= ANTI-CONTEKAN ================= */
["contextmenu","copy","cut","paste","dragstart","selectstart"].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest("input"))e.preventDefault()}));
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["c","v","x","u","s","p","a"].includes(e.key.toLowerCase())||e.key=="F12"||e.key=="PrintScreen")e.preventDefault()});
window.addEventListener("beforeunload",e=>{if(st&&!done){e.preventDefault();e.returnValue=""}});
function fs(){const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)}catch(e){}}
function inFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function violation(why){
  if(!st||done||Date.now()-lastV<1500)return; lastV=Date.now();
  st.v++; st.log.push(new Date().toLocaleTimeString("id-ID")+" "+why); save();
  if(st.v>=CONFIG.MAKS_PELANGGARAN){submit("Otomatis (pelanggaran)");return}
  $("#ovm").innerHTML=`${why}.<br>Pelanggaran <b>${st.v} dari ${CONFIG.MAKS_PELANGGARAN}</b>. Jika mencapai batas, jawaban dikirim otomatis dan ujian berakhir.`;
  $("#ov").style.display="flex"; renderBar();
}
$("#ovb").onclick=()=>{$("#ov").style.display="none";fs()};
document.addEventListener("visibilitychange",()=>{if(document.hidden)violation("Keluar dari halaman / pindah tab / aplikasi")});
window.addEventListener("blur",()=>{if(!document.hidden)setTimeout(()=>{if(!document.hasFocus())violation("Layar kehilangan fokus")},300)});
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{if(!inFs())violation("Keluar dari mode layar penuh")}));

/* ================= TAMPILAN ================= */
function gambar(){
  // batang = barisan aritmetika (naik tetap) · kurva = barisan geometri (naik makin cepat) · koin = bunga
  const P=[[150,124],[205,122],[255,98],[300,22]],bz=t=>{const u=1-t;return[0,1].map(i=>u*u*u*P[0][i]+3*u*u*t*P[1][i]+3*u*t*t*P[2][i]+t*t*t*P[3][i])};
  const bar=Array.from({length:6},(_,i)=>{const hh=22+i*15;return `<rect class="bar" x="${14+i*21}" y="${128-hh}" width="15" height="${hh}" rx="4" fill="url(#gb)" style="animation-delay:${0.6+i*0.13}s"/>`}).join("");
  const dot=[0,.2,.4,.6,.8,1].map((t,i)=>{const[x,y]=bz(t);return `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff" stroke="#ffd166" stroke-width="2" style="animation-delay:${1.5+i*0.3}s"/>`}).join("");
  return `<svg class="gbr" viewBox="0 0 330 168" role="img" aria-label="Grafik barisan aritmetika dan geometri">
   <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
   <filter id="gl"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   <line x1="8" y1="130" x2="322" y2="130" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
   ${bar}
   <path class="kurva" pathLength="1" d="M${P[0]} C${P[1]} ${P[2]} ${P[3]}" fill="none" stroke="#ffd166" stroke-width="4.5" stroke-linecap="round" filter="url(#gl)"/>
   ${dot}
   <g class="koin"><circle cx="304" cy="14" r="13" fill="#ffd166" stroke="#fff" stroke-width="2"/><text x="304" y="19.5" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5a00" font-family="Georgia,serif">%</text></g>
   <text class="tx" x="14" y="150" font-size="11.5" fill="#fff" fill-opacity=".9" font-family="Georgia,serif" font-style="italic">a, a+b, a+2b, …</text>
   <text class="tx" x="172" y="150" font-size="11.5" fill="#ffe08a" font-family="Georgia,serif" font-style="italic">a, ar, ar², …</text>
   <text class="tx" x="14" y="164" font-size="10" fill="#fff" fill-opacity=".7" font-family="system-ui,sans-serif" letter-spacing=".08em">ARITMETIKA</text>
   <text class="tx" x="172" y="164" font-size="10" fill="#ffe08a" fill-opacity=".85" font-family="system-ui,sans-serif" letter-spacing=".08em">GEOMETRI</text>
  </svg>`;
}
function depan(msg){
  const sim=["Σ","∞","a","r","Uₙ","Sₙ","%","+","×","2ⁿ","d","1,05","n","b"];
  app.innerHTML=`<div class="hero"><div id="fl"></div><div class="wrap hc"><div class="card cover">
    <div class="lbl">ULANGAN HARIAN</div>
    <h1>${CONFIG.JUDUL}</h1>
    <div class="sub">Kelas X · ${CONFIG.SEKOLAH}</div>
    <div class="guru">Guru: ${CONFIG.GURU}</div>
    ${gambar()}
    <div class="info"><span>📝 15 soal</span><span>⏱ ${CONFIG.DURASI_MENIT} menit</span><span>🔁 ${CONFIG.KESEMPATAN} kesempatan · nilai terbesar diambil</span></div>
    <ul class="rules"><li>Ujian berjalan dalam <b>layar penuh</b>.</li>
    <li>Dilarang pindah tab/aplikasi, membuka aplikasi lain, atau menyalin soal.</li>
    <li>Setiap pelanggaran dicatat dan dilihat guru. Batas <b>${CONFIG.MAKS_PELANGGARAN} kali</b>, setelah itu jawaban otomatis dikirim.</li></ul>
    <div class="err" style="color:#ffd0d0">${msg||""}</div>
    <button class="btn-mulai" id="mulai0">Mulai ▶</button></div></div></div>`;
  const f=$("#fl");for(let i=0;i<16;i++){const s=document.createElement("span");s.textContent=sim[i%sim.length];
    s.style.cssText=`left:${Math.random()*95}%;font-size:${22+Math.random()*44}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;f.appendChild(s)}
  $("#mulai0").onclick=()=>login(msg);
}
async function login(msg){
  app.innerHTML=`<div class="wrap"><div class="card"><h1>${CONFIG.JUDUL}</h1><p class="mu">Memuat daftar siswa…</p></div></div>`;
  let D,MK=3;
  try{const r=await fetch(CONFIG.SCRIPT_URL+"?aksi=daftar");const J=await r.json();D=J.kelas;MK=J.maks||3;if(!D||!Object.keys(D).length)throw 0}
  catch(e){app.innerHTML=`<div class="wrap"><div class="card"><h1>Daftar siswa gagal dimuat</h1><p class="mu">Periksa koneksi internet. Jika terus gagal, hubungi guru (sheet "Siswa" mungkin masih kosong).</p><button id="rt">Coba Lagi</button></div></div>`;$("#rt").onclick=()=>login(msg);return}
  const kls=Object.keys(D);
  app.innerHTML=`<div class="wrap"><div class="card"><button class="back" id="bk">‹ Kembali</button><h1>Isi Identitas</h1><div class="mu">${CONFIG.JUDUL} · ${CONFIG.SEKOLAH}</div>
  <label>Kelas</label><select id="kl"><option value="">— pilih kelas —</option>${kls.map(k=>`<option>${esc(k)}</option>`).join("")}</select>
  <label>Nama</label><select id="nm" disabled><option value="">— pilih kelas dulu —</option></select>
  <div class="mu" id="inf"></div><div class="err" id="er">${msg||""}</div><br><button id="go">Mulai Ujian</button></div></div>`;
  $("#bk").onclick=()=>depan(msg);
  $("#kl").onchange=()=>{const k=$("#kl").value,n=$("#nm");
    n.disabled=!k;n.innerHTML=k?`<option value="">— pilih nama —</option>`+D[k].map((x,i)=>`<option value="${i}"${x.c>=MK?" disabled":""}>${esc(x.n)}${x.c>=MK?" (percobaan habis)":x.c?` (sudah ${x.c}x)`:""}</option>`).join(""):`<option value="">— pilih kelas dulu —</option>`};
  $("#nm").onchange=()=>{const v=$("#nm").value,k=$("#kl").value;$("#inf").textContent=v===""?"":`Percobaan ke-${D[k][+v].c+1} dari ${MK}. Nilai yang diambil adalah nilai TERBESAR dari semua percobaan.`};
  $("#go").onclick=()=>{
    const kl=$("#kl").value,ix=$("#nm").value;
    if(!kl||ix==="")return $("#er").textContent="Pilih kelas dan nama kamu.";
    const nm=D[kl][+ix].n,ab=+ix+1,c0=D[kl][+ix].c;
    if(!confirm(`Kamu memilih:\n${nm}\nKelas ${kl}\n\nSudah benar?`))return;
    const id=(nm+"|"+kl+"|"+ab).toLowerCase(); let old=null;
    try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(old&&old.id==id&&!old.done){st=old;st.v++;st.log.push("Memuat ulang halaman")}
    else{if(old&&!old.done&&old.id!=id)return $("#er").textContent="Ada ujian lain yang belum selesai di perangkat ini.";
      st={id,nm,kl,ab,att:c0+1,mk:MK,cur:0,seed:Math.floor(Math.random()*1e9),start:Date.now(),ans:{},v:0,log:[],done:false}}
    save();fs();mulai();
  };
}
function mulai(){
  const r=rng(st.seed+7);
  qs=shuf(buatSoal(st.seed),r).map(q=>q.o&&!q.fix?{...q,o:shuf(q.o,r)}:q);
  app.innerHTML=`<div class="bar"><span id="b1"></span><span id="b2"></span></div><div class="wrap"><div class="chips" id="chips"></div><div id="soal"></div><div class="navb"><button class="sec" id="prev">‹ Sebelumnya</button><button id="next">Selanjutnya ›</button></div></div>`;
  $("#soal").innerHTML=qs.map((q,i)=>`<div class="card q" style="display:none"><b>Soal ${i+1} dari ${qs.length}</b><span class="tag">${q.tag}</span><p>${q.q}</p>${isi(q)}</div>`).join("");
  $("#chips").innerHTML=qs.map((q,i)=>`<button class="chip" data-c="${i}">${i+1}</button>`).join("");
  document.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("input",()=>{ambil();chips()}));
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>tampil(+b.dataset.c));
  $("#prev").onclick=()=>tampil(st.cur-1);
  $("#next").onclick=()=>{if(st.cur<qs.length-1)tampil(st.cur+1);else{
    const k=qs.filter(q=>!jawab(q)).length;
    if(confirm(k?`Masih ada ${k} soal belum dijawab. Tetap kirim sekarang?`:"Semua soal sudah dijawab. Kirim jawaban sekarang?"))submit("Selesai")}};
  pulih();tampil(Math.min(st.cur||0,qs.length-1));renderBar();
  timerId=setInterval(renderBar,1000);
}
function jawab(q){const a=st.ans[q.id];if(a===undefined)return false;if(q.type=="pk")return a.length>0;if(q.type=="bs")return Object.keys(a).length>0;return true}
function chips(){document.querySelectorAll("[data-c]").forEach((b,i)=>{b.classList.toggle("ok",jawab(qs[i]));b.classList.toggle("on",i==st.cur)})}
function tampil(i){
  if(i<0||i>=qs.length)return;st.cur=i;save();
  document.querySelectorAll(".q").forEach((c,j)=>c.style.display=j==i?"block":"none");
  $("#prev").style.visibility=i==0?"hidden":"visible";
  $("#next").textContent=i==qs.length-1?"Kirim Jawaban ✓":"Selanjutnya ›";
  chips();window.scrollTo(0,0);
}
function isi(q){
  if(q.type=="pg")return q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${q.id}" data-q="${q.id}" value="${j}"><span>${esc(o.t)}</span></label>`).join("");
  if(q.type=="pk")return q.o.map((o,j)=>`<label class="opt"><input type="checkbox" data-q="${q.id}" value="${j}"><span>${esc(o.t)}</span></label>`).join("");
  if(q.type=="bs")return `<table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>`+q.o.map((o,j)=>`<tr><td>${esc(o.t)}</td><td class="c"><input type="radio" name="${q.id}_${j}" data-q="${q.id}" data-j="${j}" value="1"></td><td class="c"><input type="radio" name="${q.id}_${j}" data-q="${q.id}" data-j="${j}" value="0"></td></tr>`).join("")+`</table>`;
  return `<input type="number" inputmode="decimal" data-q="${q.id}" placeholder="Tulis jawaban (angka)">`;
}
function ambil(){
  qs.forEach(q=>{
    const els=[...document.querySelectorAll(`[data-q="${q.id}"]`)];
    if(q.type=="pg"){const c=els.find(e=>e.checked);if(c)st.ans[q.id]=+c.value}
    else if(q.type=="pk")st.ans[q.id]=els.filter(e=>e.checked).map(e=>+e.value);
    else if(q.type=="bs"){const m={};els.filter(e=>e.checked).forEach(e=>m[e.dataset.j]=+e.value);st.ans[q.id]=m}
    else if(els[0].value!=="")st.ans[q.id]=parseFloat(els[0].value);
  });save();
}
function pulih(){
  qs.forEach(q=>{const a=st.ans[q.id];if(a===undefined)return;
    const els=[...document.querySelectorAll(`[data-q="${q.id}"]`)];
    if(q.type=="pg")els.forEach(e=>e.checked=+e.value===a);
    else if(q.type=="pk")els.forEach(e=>e.checked=a.includes(+e.value));
    else if(q.type=="bs")els.forEach(e=>e.checked=a[e.dataset.j]!==undefined&&a[e.dataset.j]==+e.value);
    else els[0].value=a});
}
function sisa(){return Math.max(0,CONFIG.DURASI_MENIT*60-Math.floor((Date.now()-st.start)/1000))}
function renderBar(){
  if(!$("#b1"))return;const s=sisa();
  $("#b1").textContent=`${st.nm} · Percobaan ${st.att||1}`;
  $("#b2").textContent=`⏱ ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")} · ⚠ ${st.v}/${CONFIG.MAKS_PELANGGARAN}`;
  if(s<=0&&!done)submit("Otomatis (waktu habis)");
}

/* ================= PENILAIAN & PENGIRIMAN ================= */
function nilai(){
  let benar=0;const det=[];
  qs.forEach(q=>{const a=st.ans[q.id];let sk=0;
    if(a!==undefined){
      if(q.type=="pg")sk=q.o[a]&&q.o[a].ok?1:0;
      else if(q.type=="pk"){const k=q.o.map((o,j)=>o.ok?j:-1).filter(j=>j>=0);sk=(k.length==a.length&&k.every(j=>a.includes(j)))?1:0}
      else if(q.type=="bs")sk=q.o.filter((o,j)=>a[j]!==undefined&&a[j]==o.ok).length/q.o.length;
      else sk=Math.abs(a-q.ans)<=(q.tol||1e-6)?1:0}
    benar+=sk;det.push(q.id+":"+(a===undefined?"-":JSON.stringify(a))+"="+(+sk.toFixed(2)))});
  return{benar:+benar.toFixed(2),det};
}
async function cek(){try{const J=await(await fetch(CONFIG.SCRIPT_URL+"?aksi=daftar&t="+Date.now())).json();const x=J.kelas[st.kl][st.ab-1];return !!x&&x.c>=st.att}catch(e){return false}}
async function submit(status){
  if(done)return;done=true;clearInterval(timerId);ambil&&qs.length&&ambil();
  $("#ov").style.display="none";
  try{if(inFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}
  const h=nilai(),total=qs.length;
  const data={nama:st.nm,kelas:st.kl,absen:st.ab,paket:st.seed.toString(36),skor:+(h.benar/total*100).toFixed(1),benar:h.benar,total,
    sesi:"S"+st.seed,pelanggaran:st.v,logPelanggaran:st.log.join(" | "),durasiMenit:+((Date.now()-st.start)/60000).toFixed(1),status,detail:h.det.join(" ; ")};
  app.innerHTML=`<div class="wrap"><div class="card"><h1>Mengirim jawaban…</h1><p class="mu">Jangan tutup halaman ini.</p></div></div>`;
  let ok=false,res=null;
  for(let i=0;i<3&&!ok;i++){
    try{const r=await fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
      const j=await r.json();res=j;ok=j.ok;if(j.batas)break}catch(e){
      try{await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});await new Promise(r=>setTimeout(r,2500));ok=await cek()}catch(e2){await new Promise(r=>setTimeout(r,1500))}}
  }
  const fm=x=>String(+(+x).toFixed(1)).replace(".",",");
  const balik=()=>{clearInterval(t);st=null;qs=[];done=false;lastV=0;depan()};let t,c=20;
  if(res&&res.batas){st.done=true;save();app.innerHTML=`<div class="wrap"><div class="card"><h1>Batas percobaan habis</h1><p>Kamu sudah memakai semua kesempatan mengerjakan. Nilai terbesarmu yang diambil guru.</p><button id="kb">Kembali</button></div></div>`;$("#kb").onclick=()=>{st=null;qs=[];done=false;depan()};return}
  if(ok){st.done=true;save();const nm=st.nm,mk=(res&&res.maks)||st.mk||3,pc=(res&&res.percobaan)||st.att||1,tb=res&&res.terbaik!=null?res.terbaik:null,sisa=Math.max(0,mk-pc);
    app.innerHTML=`<div class="wrap"><div class="card" style="text-align:center"><h1>✅ Jawaban terkirim</h1><p>Terima kasih, ${esc(nm)}.</p>
    <div class="mu">Nilai percobaan ke-${pc}</div><div style="font-size:3rem;font-weight:700;color:var(--pr);line-height:1.1">${fm(data.skor)}</div>
    <p class="mu">Benar ${fm(data.benar)} dari ${data.total} soal</p>
    <p>${tb!==null?`Nilai terbaikmu saat ini: <b>${fm(tb)}</b><br>`:""}<span class="mu">${sisa?`Kamu masih punya ${sisa} kesempatan lagi. Nilai yang diambil adalah nilai terbesar.`:"Kesempatan mengerjakan sudah habis. Nilai terbesar yang diambil."}</span></p>
    <p class="mu">Kembali ke halaman awal dalam <b id="cd">${c}</b> detik…</p><button class="sec" id="kb">Kembali Sekarang</button></div></div>`;
    t=setInterval(()=>{c--;if(c<=0)balik();else $("#cd").textContent=c},1000);
    $("#kb").onclick=balik}
  else{done=false;app.innerHTML=`<div class="wrap"><div class="card"><h1>Gagal mengirim</h1><p>Periksa koneksi internet, lalu tekan tombol di bawah. Jawabanmu tersimpan.</p><button id="rt">Kirim Ulang</button></div></div>`;$("#rt").onclick=()=>submit(status)}
}

/* ================= MULAI ================= */
(function(){
  let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    depan(old&&!old.done?"Ada ujian yang belum selesai. Pilih kelas dan nama yang sama untuk melanjutkan (dihitung 1 pelanggaran).":"");
})();
</script>
